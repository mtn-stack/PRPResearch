name: Daily URA Residential Planning Fetch

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run URA fetch script
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: |
          python main.py

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Restore rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Upload results to OneDrive Data folder
        run: |
          rclone copy data "${{ secrets.ONEDRIVE_REMOTE_PATH }}" --create-empty-src-dirs
          rclone ls "${{ secrets.ONEDRIVE_REMOTE_PATH }}"
